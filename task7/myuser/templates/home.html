<!DOCTYPE html>
<html>

<head>

    <title>Student Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );
        }

        .navbar {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 20px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }

        .nav-links a {
            text-decoration: none;
            color: #475569;
            margin-left: 25px;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 80px auto;
        }

        .hero {
            background: white;
            text-align: center;
            padding: 70px 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.10);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            color: #1e1b4b;
            margin-bottom: 18px;
        }

        .description {
            color: #64748b;
            font-size: 18px;
            line-height: 1.6;
            max-width: 650px;
            margin: auto;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
        }

        .login-btn {
            background: #4f46e5;
            color: white;
        }

        .signup-btn {
            background: #e0e7ff;
            color: #3730a3;
        }

        .login-btn:hover {
            background: #4338ca;
        }

        .signup-btn:hover {
            background: #c7d2fe;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .feature {
            padding: 18px 25px;
            background: #f8fafc;
            border-radius: 12px;
            color: #475569;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            Student Portal
        </div>

        <div class="nav-links">
            <a href="{% url 'login' %}">
                Login
            </a>

            <a href="{% url 'signup' %}">
                Register
            </a>
        </div>

    </div>


    <div class="container">

        <div class="hero">

            <div class="icon">
                🎓
            </div>

            <h1>
                Student Management System
            </h1>

            <p class="description">
                A simple and professional student portal
                where you can create an account, login,
                and securely submit your student information.
            </p>


            <div class="buttons">

                <a
                    href="{% url 'login' %}"
                    class="btn login-btn">

                    Login

                </a>


                <a
                    href="{% url 'signup' %}"
                    class="btn signup-btn">

                    Create Account

                </a>

            </div>


            <div class="features">

                <div class="feature">
                    🔐 Secure Login
                </div>

                <div class="feature">
                    📝 Student Form
                </div>

                <div class="feature">
                    💾 Database
                </div>

            </div>

        </div>

    </div>

</body>

</html>
