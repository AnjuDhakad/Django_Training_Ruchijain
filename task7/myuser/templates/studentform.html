<!DOCTYPE html>
<html>

<head>

    <title>Student Details</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );
        }

        .navbar {
            background: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 20px rgba(0,0,0,0.08);
        }

        .logo {
            color: #4f46e5;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .welcome {
            color: #475569;
            font-weight: bold;
        }

        .logout {
            text-decoration: none;
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .logout:hover {
            background: #dc2626;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 55px auto;
        }

        .card {
            background: white;
            padding: 45px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.10);
        }

        .icon {
            text-align: center;
            font-size: 50px;
        }

        h1 {
            text-align: center;
            color: #1e1b4b;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

    </style>

</head>

<body>


    <div class="navbar">

        <div class="logo">
            Student Portal
        </div>


        <div class="nav-right">

            <div class="welcome">
                Welcome, {{ username }}
            </div>

            <a
                href="{% url 'logout' %}"
                class="logout">

                Logout

            </a>

        </div>

    </div>


    <div class="container">

        <div class="card">

            <div class="icon">
                🎓
            </div>

            <h1>
                Student Details
            </h1>

            <p class="subtitle">
                Enter your student information
            </p>


            <form
                method="POST"
                action="{% url 'savestudent' %}">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter student name"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Student Number
                    </label>

                    <input
                        type="text"
                        name="number"
                        placeholder="Enter student number"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Student Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter student email"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Branch
                    </label>

                    <input
                        type="text"
                        name="branch"
                        placeholder="Enter your branch"
                        required>

                </div>


                <button type="submit">
                    Save Student Details
                </button>

            </form>

        </div>

    </div>

</body>

</html>
