<!DOCTYPE html>
<html>

<head>

    <title>Create Account</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );
        }

        .navbar {
            background: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 20px rgba(0,0,0,0.08);
        }

        .logo {
            color: #4f46e5;
            font-size: 24px;
            font-weight: bold;
        }

        .home-link {
            text-decoration: none;
            color: #475569;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 550px;
            margin: 55px auto;
        }

        .card {
            background: white;
            padding: 45px;
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.10);
        }

        .icon {
            text-align: center;
            font-size: 50px;
        }

        h1 {
            text-align: center;
            color: #1e1b4b;
            margin: 10px 0;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .bottom a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            Student Portal
        </div>

        <a
            href="{% url 'home' %}"
            class="home-link">

            Home

        </a>

    </div>


    <div class="container">

        <div class="card">

            <div class="icon">
                📝
            </div>

            <h1>
                Create Account
            </h1>

            <p class="subtitle">
                Register to access the student portal
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="POST"
                action="{% url 'saveuser' %}">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <div class="bottom">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>

        </div>

    </div>

</body>

</html>
