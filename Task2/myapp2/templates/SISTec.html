<!DOCTYPE html>
<html>
<head>
    <title>SISTec Website</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            height: 100vh;

            background-color: lightblue;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: white;

            width: 500px;
            padding: 40px;

            text-align: center;

            border-radius: 20px;

            box-shadow: 0px 5px 20px gray;
        }

        h1 {
            color: darkblue;
            font-size: 35px;
            margin-bottom: 15px;
        }

        p {
            color: darkslategray;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .sistec-button {
            display: inline-block;

            background-color: darkblue;
            color: white;

            padding: 15px 35px;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            border-radius: 10px;
        }

        .sistec-button:hover {
            background-color: royalblue;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to SISTec</h1>

        <p>
            Sagar Institute of Science and Technology
        </p>

        <a href="https://www.sistecgn.ac.in/"
           target="_blank"
           class="sistec-button">

            Visit SISTec Website

        </a>

    </div>

</body>
</html>
