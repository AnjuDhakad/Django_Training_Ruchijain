{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Placement Prediction</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="form-title">

            <div class="form-icon">
                🤖
            </div>

            <h1>
                Student Placement Prediction
            </h1>

            {% if student %}

            <p>
                Welcome, {{ student.name }}
            </p>

            {% else %}

            <p>
                Enter your academic and profile details
            </p>

            {% endif %}

        </div>


        <form method="POST"
              action="{% url 'result' %}">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    IQ
                </label>

                <input
                    type="number"
                    step="any"
                    name="iq"
                    placeholder="Enter IQ score"
                    required>

            </div>


            <div class="form-group">

                <label>
                    CGPA
                </label>

                <input
                    type="number"
                    step="any"
                    name="cgpa"
                    placeholder="Enter CGPA"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Profile Score
                </label>

                <input
                    type="number"
                    step="any"
                    name="profile_score"
                    placeholder="Enter profile score"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary full-btn">

                Predict Placement

            </button>

        </form>

    </div>

</div>

</body>
</html>
