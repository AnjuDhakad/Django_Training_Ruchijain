{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>

<body>

<div class="container">

    <div class="card">

        <div class="form-title">

            <div class="form-icon">
                📝
            </div>

            <h1>
                Student Registration
            </h1>

            <p>
                Create your account to continue
            </p>

        </div>


        <form method="POST"
              action="{% url 'save_student' %}">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Student ID
                </label>

                <input
                    type="text"
                    name="student_id"
                    placeholder="Enter student ID"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter full name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Student Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Branch
                </label>

                <input
                    type="text"
                    name="branch"
                    placeholder="Example: AI & Data Science"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Student Number
                </label>

                <input
                    type="text"
                    name="student_number"
                    placeholder="Enter mobile number"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Student Email
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter email address"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary full-btn">

                Create Account

            </button>

        </form>


        <div class="bottom-text">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
