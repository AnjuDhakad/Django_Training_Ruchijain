{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{% static 'style.css' %}">

</head>

<body>

<div class="container">

    <div class="card login-card">

        <div class="form-title">

            <div class="form-icon">
                🔐
            </div>

            <h1>
                Student Login
            </h1>

            <p>
                Login to access placement prediction
            </p>

        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST"
              action="{% url 'login_validation' %}">

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter student name"
                    required>

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary full-btn">

                Login

            </button>

        </form>


        <div class="bottom-text">

            Don't have an account?

            <a href="{% url 'studentregister' %}">
                Create New Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
