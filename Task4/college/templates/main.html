<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Information Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 850px;
            background-color: white;
            padding: 50px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0px 15px 40px rgba(0, 0, 0, 0.15);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #172554;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #64748b;
            font-size: 18px;
            margin-bottom: 40px;
        }

        .line {
            width: 80px;
            height: 4px;
            background-color: #2563eb;
            margin: 0 auto 30px;
            border-radius: 10px;
        }

        .college-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .card {
            width: 210px;
            padding: 25px 15px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0px 10px 25px rgba(37, 99, 235, 0.15);
        }

        .card h2 {
            color: #1e3a8a;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .card p {
            color: #64748b;
            font-size: 14px;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            padding: 13px 28px;
            margin: 6px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .buttons a:hover {
            transform: translateY(-3px);
            box-shadow: 0px 8px 20px rgba(37, 99, 235, 0.3);
        }

        footer {
            margin-top: 35px;
            color: #94a3b8;
            font-size: 13px;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🎓</div>

        <h1>College Information Portal</h1>

        <div class="line"></div>

        <p class="subtitle">
            Explore information about leading colleges in Bhopal
        </p>

        <div class="college-info">

            <div class="card">
                <h2>SISTec</h2>
                <p>
                    Sagar Institute of Science and Technology
                </p>
            </div>

            <div class="card">
                <h2>LNCT</h2>
                <p>
                    Lakshmi Narain College of Technology
                </p>
            </div>

            <div class="card">
                <h2>OIST</h2>
                <p>
                    Oriental Institute of Science and Technology
                </p>
            </div>

        </div>

        <div class="buttons">

            <a href="/">Home</a>

            <a href="/sistec/">SISTec</a>

            <a href="/lnct/">LNCT</a>

            <a href="/oist/">OIST</a>

        </div>

        <footer>
            © 2026 College Information Portal
        </footer>

    </div>

</body>
</html>
