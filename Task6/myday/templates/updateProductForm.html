<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Update Product</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .navbar {
            background: #111827;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 25px;
        }

        .nav-links a:hover {
            color: white;
        }

        .form-container {
            width: 90%;
            max-width: 550px;
            margin: 50px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        input[type="submit"] {
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background: #1d4ed8;
        }

        .cancel {
            display: inline-block;
            padding: 12px 22px;
            background: #e5e7eb;
            color: #111827;
            border-radius: 8px;
            text-decoration: none;
            margin-left: 8px;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ProductHub
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'Productlist' %}">
                Products
            </a>

        </div>

    </nav>


    <div class="form-container">

        <div class="form-card">

            <h1>Update Product</h1>

            <form action="{% url 'updateProduct' %}"
                  method="post">

                {% csrf_token %}

                <input type="hidden"
                       name="id"
                       value="{{product.id}}">


                <label for="p_name">
                    Product Name
                </label>

                <input type="text"
                       name="p_name"
                       id="p_name"
                       value="{{product.p_name}}"
                       required>


                <label for="p_price">
                    Product Price
                </label>

                <input type="number"
                       name="p_price"
                       id="p_price"
                       value="{{product.p_price}}"
                       required>


                <label for="p_offer">
                    Product Offer
                </label>

                <input type="text"
                       name="p_offer"
                       id="p_offer"
                       value="{{product.p_offer}}"
                       required>


                <input type="submit"
                       value="Update Product">

                <a href="{% url 'Productlist' %}"
                   class="cancel">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</body>

</html>
