<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product List</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .navbar {
            background: #111827;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
            margin-left: 25px;
        }

        .nav-links a:hover {
            color: white;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .table-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.07);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #111827;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
        }

        tr:hover {
            background: #f9fafb;
        }

        .update {
            background: #2563eb;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .update:hover {
            background: #1d4ed8;
        }

        .delete {
            background: #dc2626;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            margin-left: 5px;
        }

        .delete:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ProductHub
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'Productlist' %}">
                Products
            </a>

            <a href="{% url 'newProductForm' %}">
                Add Product
            </a>

        </div>

    </nav>


    <div class="container">

        <div class="header">

            <h1>Product List</h1>

            <a href="{% url 'newProductForm' %}"
               class="add-btn">
                + Add Product
            </a>

        </div>


        <div class="table-card">

            <table>

                <tr>

                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Offer</th>
                    <th>Action</th>

                </tr>


                {% for i in Products %}

                <tr>

                    <td>
                        {{i.id}}
                    </td>

                    <td>
                        {{i.p_name}}
                    </td>

                    <td>
                        ₹ {{i.p_price}}
                    </td>

                    <td>
                        {{i.p_offer}}
                    </td>

                    <td>

                        <a href="{% url 'updateProductForm' %}?id={{i.id}}"
                           class="update">
                            Update
                        </a>

                        <a href="{% url 'deleteProduct' %}?id={{i.id}}"
                           class="delete"
                           onclick="return confirm('Are you sure you want to delete this product?');">
                            Delete
                        </a>

                    </td>

                </tr>

                {% empty %}

                <tr>

                    <td colspan="5"
                        class="empty">

                        No products available.

                    </td>

                </tr>

                {% endfor %}

            </table>

        </div>

    </div>

</body>

</html>
